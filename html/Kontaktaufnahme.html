<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontaktaufnahme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <form>
      <div class="row mb-4 mt-3">
        <div class="col-1"></div>
        <div class="col-1 text-start">
          <h5 class="fw-bold">Kontaktaufnahme</h5>
        </div>
      </div>

      <div class="row align-items-center mb-3">
        <div class="col-1"></div>
        <div class="col-1 text-start">
          <label for="betreff" class="col-form-label fw-semibold">Betreff</label>
        </div>

        <div class="col-8">
          <input
            type="text"
            id="betreff"
            class="form-control bg-success text-white"
          />
        </div>
        <div class="col-1"></div>
      </div>

      <div class="row align-items-center mb-3">
        <div class="col-1"></div>
        <div class="col-1 text-start">
          <label for="name" class="col-form-label fw-semibold">Name</label>
        </div>

        <div class="col-8">
          <input
            type="text"
            id="name"
            class="form-control bg-primary text-white"
          />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-1"></div>
        <div class="col-1 text-start">
          <label for="anliegen" class="col-form-label fw-semibold">Anliegen</label>
        </div>

        <div class="col-5">
          <textarea
            id="anliegen"
            rows="5"
            class="form-control bg-danger text-white"></textarea>
        </div>
        <div class="col-3 d-flex align-items-start">
          <div class="w-100 bg-warning p-3 rounded d-flex align-items-center justify-content-start">
            <input type="checkbox" id="antwort" class="form-check-input me-2" />
            <label for="antwort" class="form-check-label fw-semibold">Ich wünsche eine Antwort</label>
          </div>
        </div>
      </div>
      
      <div class="row mt-4">
        <div class="col-1"></div>
        <div class="col-5">
          <button type="submit" class="btn btn-outline-dark shadow-sm px-4">
            Senden
          </button>
        </div>
        <div class="col-4 text-end">
          <button type="reset" class="btn btn-outline-dark shadow-sm px-4">
            Reset
          </button>
        </div>
        <div class="col-2"></div>
      </div>
    </form>
  
  </body>
</html>
